<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn thi Tự luận - Môi trường & Phát triển Bền vững</title>
    <!-- Thư viện React, Tailwind CSS và FontAwesome -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; scroll-behavior: smooth; }</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Dữ liệu 10 câu hỏi tự luận bám sát PDF
        const essayData = [
          {
            id: 1,
            title: "Chương 1 - Phát triển bền vững",
            question: "Định nghĩa Phát triển bền vững theo Ủy ban Brundtland (1987) là gì? Phân tích sự tương tác giữa 3 trụ cột (Kinh tế, Xã hội, Môi trường) để tạo nên sự phát triển bền vững.",
            standardAnswer: "Phát triển bền vững là sự phát triển đáp ứng được các nhu cầu của thế hệ hiện tại mà không làm tổn hại đến khả năng đáp ứng nhu cầu của các thế hệ tương lai. Ba trụ cột không tồn tại độc lập mà giao thoa: Kinh tế x Xã hội tạo ra sự Công bằng; Kinh tế x Môi trường tạo ra sự Khả thi; Xã hội x Môi trường tạo ra sự Bền chịu. Chỉ khi thỏa mãn đồng thời cả 3 (Giao thoa giữa cả 3) thì mới đạt được sự Bền vững.",
            rubric: [
              { criterion: "Nêu đúng định nghĩa Brundtland (1987)", points: 2.5 },
              { criterion: "Nêu được 3 trụ cột: Kinh tế, Xã hội, Môi trường", points: 1.5 },
              { criterion: "Phân tích Kinh tế x Xã hội = Công bằng (Equitable)", points: 2.0 },
              { criterion: "Phân tích Kinh tế x Môi trường = Khả thi (Viable)", points: 2.0 },
              { criterion: "Phân tích Xã hội x Môi trường = Bền chịu (Bearable) và tổng hợp thành Bền vững", points: 2.0 }
            ]
          },
          {
            id: 2,
            title: "Chương 1 - Tài nguyên & Vốn tự nhiên",
            question: "Phân biệt Tài nguyên thiên nhiên tái tạo và không tái tạo (cho ví dụ). Tại sao Vốn tự nhiên (Natural Capital) được coi là nền tảng của PTBV? Kể tên 4 nhóm dịch vụ hệ sinh thái.",
            standardAnswer: "Tài nguyên tái tạo là loại có thể tự phục hồi nếu khai thác bền vững (rừng, nước, NL mặt trời). TN không tái tạo là loại hình thành hàng triệu năm, khai thác sẽ cạn kiệt (than, dầu, khoáng sản). Vốn tự nhiên là nền tảng vì nó cung cấp toàn bộ kho lưu trữ nguồn lực thiên nhiên duy trì dòng chảy dịch vụ hệ sinh thái phục vụ con người. 4 nhóm dịch vụ: Cung ứng, Điều tiết, Văn hóa, Hỗ trợ.",
            rubric: [
              { criterion: "Định nghĩa và ví dụ Tài nguyên tái tạo", points: 2.0 },
              { criterion: "Định nghĩa và ví dụ Tài nguyên không tái tạo", points: 2.0 },
              { criterion: "Giải thích vai trò nền tảng của Vốn tự nhiên", points: 2.0 },
              { criterion: "Nêu đủ 4 dịch vụ: Cung ứng, Điều tiết, Văn hóa, Hỗ trợ", points: 4.0 }
            ]
          },
          {
            id: 3,
            title: "Chương 2 - Môi trường Không khí",
            question: "Trình bày cơ chế hình thành và tác động của hiện tượng Khói quang hóa (Photochemical Smog) và Mưa axit (Acid Rain).",
            standardAnswer: "Khói quang hóa hình thành do phản ứng giữa NOx và VOCs dưới bức xạ tia cực tím (UV) mặt trời, tạo ra Ozone mặt đất, gây kích ứng mắt, phổi, giảm tầm nhìn. Mưa axit hình thành do khí SO2 và NOx phản ứng với hơi nước trong khí quyển tạo thành H2SO4 và HNO3 làm mưa có pH < 5.6. Mưa axit gây chết rừng, axit hóa hồ nước và ăn mòn công trình, di sản.",
            rubric: [
              { criterion: "Cơ chế Khói quang hóa (NOx + VOCs + UV -> Ozone mặt đất)", points: 2.5 },
              { criterion: "Tác động của Khói quang hóa (Kích ứng hô hấp, mắt, giảm tầm nhìn)", points: 2.5 },
              { criterion: "Cơ chế Mưa axit (SO2 + NOx + H2O -> H2SO4, HNO3, pH<5.6)", points: 2.5 },
              { criterion: "Tác động của Mưa axit (Ăn mòn công trình, chết rừng, axit hóa nước)", points: 2.5 }
            ]
          },
          {
            id: 4,
            title: "Chương 2 - Môi trường Đất",
            question: "Phân tích 3 loại hình suy thoái đất cần phòng ngừa (Xói mòn, Thoái hóa, Sa mạc hóa) và đề xuất 1 giải pháp cụ thể cho mỗi loại.",
            standardAnswer: "1. Xói mòn (Erosion): Lớp đất mặt bị cuốn trôi do nước/gió. Giải pháp: Trồng rừng phòng hộ, canh tác đường đồng mức. 2. Thoái hóa (Degradation): Đất mất dinh dưỡng, chai cứng do lạm dụng hóa chất, thâm canh. Giải pháp: Nông nghiệp bảo tồn, luân canh, làm đất tối thiểu, bón phân hữu cơ. 3. Sa mạc hóa (Desertification): Đất khô cằn mất khả năng canh tác do phá rừng/khí hậu. Giải pháp: Hàng rào sinh học chắn cát, trồng cây họ đậu cải tạo.",
            rubric: [
              { criterion: "Mô tả và đề xuất giải pháp cho Xói mòn", points: 3.0 },
              { criterion: "Mô tả và đề xuất giải pháp cho Thoái hóa", points: 3.5 },
              { criterion: "Mô tả và đề xuất giải pháp cho Sa mạc hóa", points: 3.5 }
            ]
          },
          {
            id: 5,
            title: "Chương 2 - Môi trường Nước",
            question: "Trình bày quá trình Phú dưỡng hóa (Eutrophication) trong môi trường nước và hệ lụy của nó đối với hệ sinh thái thủy sinh.",
            standardAnswer: "Phú dưỡng hóa là quá trình dư thừa chất dinh dưỡng từ nguồn thải nông nghiệp/sinh hoạt. Quá trình: (1) N, P dư thừa đi vào nguồn nước -> (2) Kích thích Tảo bùng phát (Algal bloom) che khuất ánh sáng -> (3) Tảo chết và phân hủy làm vi sinh vật tiêu thụ lượng lớn oxy hòa tan -> (4) Chỉ số DO giảm mạnh tạo 'Vùng chết' (Dead Zone) -> (5) Cá tôm chết ngạt hàng loạt, hệ sinh thái sụp đổ.",
            rubric: [
              { criterion: "Nguyên nhân: Dư thừa Nitơ (N) và Photpho (P)", points: 2.0 },
              { criterion: "Giai đoạn 1: Tảo bùng phát (Algal bloom)", points: 2.0 },
              { criterion: "Giai đoạn 2: Tảo chết phân hủy tiêu thụ Oxy", points: 2.0 },
              { criterion: "Giai đoạn 3: DO giảm mạnh (<2mg/L) tạo 'Vùng chết'", points: 2.0 },
              { criterion: "Hệ lụy: Cá tôm chết ngạt, hệ sinh thái thủy sinh sụp đổ", points: 2.0 }
            ]
          },
          {
            id: 6,
            title: "Chương 3 - Quản lý Chất thải rắn",
            question: "Trình bày thứ bậc ưu tiên xử lý chất thải rắn theo Mô hình 5R. Giải thích khái niệm Trách nhiệm mở rộng của nhà sản xuất (EPR) trong Kinh tế tuần hoàn.",
            standardAnswer: "Mô hình 5R theo thứ tự ưu tiên giảm dần: Refuse (Từ chối) -> Reduce (Giảm thiểu) -> Reuse (Tái sử dụng) -> Recycle (Tái chế) -> Recover (Thu hồi năng lượng, VD: Đốt WtE). EPR (Extended Producer Responsibility) là cơ chế bắt buộc nhà sản xuất phải chịu trách nhiệm tài chính và vật lý để thu hồi, tái chế sản phẩm/bao bì của mình sau khi người tiêu dùng vứt bỏ, thúc đẩy kinh tế tuần hoàn, giảm chôn lấp.",
            rubric: [
              { criterion: "Nêu đúng và giải thích Refuse, Reduce", points: 2.0 },
              { criterion: "Nêu đúng và giải thích Reuse, Recycle", points: 2.0 },
              { criterion: "Nêu đúng và giải thích Recover (Thu hồi NL)", points: 2.0 },
              { criterion: "Định nghĩa đúng khái niệm EPR", points: 2.0 },
              { criterion: "Liên hệ EPR với mô hình Kinh tế tuần hoàn", points: 2.0 }
            ]
          },
          {
            id: 7,
            title: "Chương 3 - Không khí & Đô thị",
            question: "Nêu các nguồn phát thải PM2.5 chính tại Hà Nội (theo %). Đề xuất 3 nhóm giải pháp cốt lõi để giảm thiểu ô nhiễm không khí tại các đô thị lớn ở Việt Nam.",
            standardAnswer: "Nguồn PM2.5 HN: Công nghiệp & Nhiệt điện (29%), Xây dựng (17%), Sinh hoạt dân sinh (17%), Giao thông (13%). Đốt rơm rạ theo mùa là tác nhân bột phát cực đoan. 3 nhóm giải pháp cốt lõi: (1) Giao thông xanh (điện hóa GTCC, áp dụng vùng phát thải thấp LEZ); (2) Kiểm soát công nghiệp (Lắp CEMS, loại bỏ nhiệt điện than); (3) Kiểm soát sinh hoạt/nông nghiệp (cấm bếp than, cấm đốt rơm rạ, phun nước công trình).",
            rubric: [
              { criterion: "Nêu đúng tỷ lệ % các nguồn thải chính tại Hà Nội", points: 4.0 },
              { criterion: "Giải pháp 1: Giao thông xanh / Điện hóa", points: 2.0 },
              { criterion: "Giải pháp 2: Quản lý Công nghiệp & Năng lượng (CEMS)", points: 2.0 },
              { criterion: "Giải pháp 3: Quản lý dân sinh, xây dựng & nông nghiệp", points: 2.0 }
            ]
          },
          {
            id: 8,
            title: "Chương 3 - Tiết kiệm Năng lượng",
            question: "Phân biệt Tiết kiệm năng lượng (Energy Conservation) và Hiệu quả năng lượng (Energy Efficiency), cho ví dụ. Khái niệm 'Negawatt' mang ý nghĩa gì?",
            standardAnswer: "Tiết kiệm NL là thay đổi hành vi/thói quen để giảm tiêu thụ điện (VD: tắt đèn khi ra khỏi phòng). Hiệu quả NL là dùng công nghệ cải tiến để sản xuất cùng lượng dịch vụ nhưng tốn ít năng lượng hơn ở đầu vào (VD: thay đèn sợi đốt bằng LED, dùng Inverter). 'Negawatt' là năng lượng không cần sản xuất ra nhờ các biện pháp tiết kiệm (1 Negawatt tiết kiệm = 1 MW điện sinh ra), là năng lượng rẻ nhất, xanh nhất.",
            rubric: [
              { criterion: "Định nghĩa và ví dụ: Tiết kiệm NL (đổi hành vi)", points: 3.5 },
              { criterion: "Định nghĩa và ví dụ: Hiệu quả NL (đổi công nghệ)", points: 3.5 },
              { criterion: "Định nghĩa 'Negawatt' và ý nghĩa bảo vệ môi trường", points: 3.0 }
            ]
          },
          {
            id: 9,
            title: "Chương 3 - Quản lý Nguồn nước",
            question: "Khung tiếp cận 3 cấp trong kiểm soát ô nhiễm nguồn nước là gì? Kể tên 2 công nghệ xử lý nước thải tiên tiến và 1 bài học phục hồi sông ô nhiễm thành công.",
            standardAnswer: "Khung 3 cấp: (1) Phòng ngừa (ưu tiên cao nhất, chi phí thấp: ĐTM, phân vùng); (2) Giảm thiểu (Kiểm soát tại nguồn, xây trạm XLNT tập trung); (3) Phục hồi (biện pháp cuối cùng, tốn kém: cải tạo sông, nạo vét bùn). 2 công nghệ XLNT: MBR (Màng lọc sinh học), Nano-Bioreactor, Đất ngập nước nhân tạo. Bài học: Sông Thames (London) xây hệ thống cống ngầm 50 năm, hoặc Cheonggyecheon (Hàn Quốc) phá đường cao tốc phục hồi suối.",
            rubric: [
              { criterion: "Nêu và giải thích cấp Phòng ngừa", points: 1.5 },
              { criterion: "Nêu và giải thích cấp Giảm thiểu", points: 1.5 },
              { criterion: "Nêu và giải thích cấp Phục hồi", points: 1.5 },
              { criterion: "Kể tên và mô tả cơ bản 2 công nghệ XLNT", points: 3.0 },
              { criterion: "Nêu 1 ví dụ phục hồi sông và bài học kinh nghiệm", points: 2.5 }
            ]
          },
          {
            id: 10,
            title: "Chương 1 - Luật & Nguyên tắc PTBV",
            question: "Nêu và giải thích 'Nguyên tắc phòng ngừa' và 'Nguyên tắc Người gây ô nhiễm phải trả tiền (PPP)' trong Phát triển bền vững.",
            standardAnswer: "1. Nguyên tắc phòng ngừa: Khi có nguy cơ thiệt hại nghiêm trọng hoặc không thể đảo ngược cho MT, sự thiếu chắc chắn về mặt khoa học không được làm lý do để trì hoãn các biện pháp ngăn chặn (Hành động an toàn trước tiên). 2. Nguyên tắc PPP: Chi phí ô nhiễm và suy thoái phải được nội hóa vào giá cả sản phẩm/dịch vụ. Tổ chức/cá nhân xả thải phải trả chi phí xử lý, đền bù (thông qua phí BVMT, thuế carbon, tín chỉ carbon).",
            rubric: [
              { criterion: "Nêu định nghĩa Nguyên tắc phòng ngừa", points: 2.5 },
              { criterion: "Giải thích ý nghĩa/ứng dụng thực tế của Nguyên tắc phòng ngừa", points: 2.5 },
              { criterion: "Nêu định nghĩa Nguyên tắc PPP", points: 2.5 },
              { criterion: "Giải thích ý nghĩa/ứng dụng thực tế của PPP", points: 2.5 }
            ]
          }
        ];

        function App() {
          const [currentIndex, setCurrentIndex] = useState(0);
          const [userAnswers, setUserAnswers] = useState({}); // { id: "text" }
          const [userScores, setUserScores] = useState({}); // { id: number }
          const [showAnswer, setShowAnswer] = useState({}); // { id: boolean }
          const [isSidebarOpen, setIsSidebarOpen] = useState(false);
          const mainRef = useRef(null);

          const currentQ = essayData[currentIndex];

          useEffect(() => {
            if (mainRef.current) {
              mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }, [currentIndex]);

          const handleTextChange = (e) => {
            setUserAnswers({ ...userAnswers, [currentQ.id]: e.target.value });
          };

          const handleSubmit = () => {
            setShowAnswer({ ...showAnswer, [currentQ.id]: true });
          };

          const handleScoreChange = (e) => {
            const val = parseFloat(e.target.value);
            if (val >= 0 && val <= 10) {
              setUserScores({ ...userScores, [currentQ.id]: val });
            } else if (e.target.value === "") {
              const newScores = { ...userScores };
              delete newScores[currentQ.id];
              setUserScores(newScores);
            }
          };

          const getCompletedCount = () => Object.keys(showAnswer).length;
          
          const getAverageScore = () => {
            const scores = Object.values(userScores);
            if (scores.length === 0) return 0;
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col md:flex-row font-sans selection:bg-emerald-200">
              
              {/* Header Mobile */}
              <div className="md:hidden bg-emerald-800 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-20">
                <div className="flex items-center gap-2 font-bold text-lg">
                  <i className="fa-solid fa-pen-to-square text-2xl"></i>
                  <span>Tự luận (10 Câu)</span>
                </div>
                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 bg-emerald-700 rounded-lg">
                  <i className="fa-solid fa-list text-xl"></i>
                </button>
              </div>

              {/* Sidebar Navigation */}
              <aside className={`${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 fixed md:sticky top-0 left-0 h-full w-80 bg-white shadow-2xl md:shadow-none md:border-r border-slate-200 z-30 flex flex-col`}>
                <div className="hidden md:flex p-6 bg-emerald-800 text-white items-center gap-4 shrink-0">
                  <i className="fa-solid fa-graduation-cap text-3xl"></i>
                  <h1 className="font-bold text-xl leading-tight">Tự luận MT<br/>& PT Bền vững</h1>
                </div>

                <div className="p-5 border-b border-slate-100 bg-slate-50 shrink-0">
                  <p className="text-sm font-bold text-slate-500 uppercase mb-2">Tiến độ làm bài</p>
                  <div className="w-full bg-slate-200 rounded-full h-2.5 mb-3 overflow-hidden">
                    <div className="bg-emerald-500 h-2.5 rounded-full transition-all" style={{ width: `${(getCompletedCount() / essayData.length) * 100}%` }}></div>
                  </div>
                  <div className="flex justify-between items-center text-sm">
                    <span className="font-semibold text-slate-700">Đã nộp: {getCompletedCount()}/{essayData.length}</span>
                    <span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded">Điểm TB: {getAverageScore()}</span>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                  {essayData.map((q, idx) => {
                    const isSubmitted = showAnswer[q.id];
                    const hasScore = userScores[q.id] !== undefined;
                    const isCurrent = currentIndex === idx;

                    let btnClass = "w-full text-left p-3 rounded-xl border-2 transition-all flex items-center justify-between outline-none ";
                    
                    if (isCurrent) {
                      btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                    } else if (isSubmitted) {
                      btnClass += "bg-white border-slate-200 text-slate-600 hover:border-emerald-300";
                    } else {
                      btnClass += "bg-slate-50 border-transparent text-slate-500 hover:bg-slate-100";
                    }

                    return (
                      <button key={q.id} onClick={() => { setCurrentIndex(idx); setIsSidebarOpen(false); }} className={btnClass}>
                        <div className="flex items-center gap-3 truncate pr-2">
                          <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${isCurrent ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-600'}`}>
                            {idx + 1}
                          </div>
                          <span className="truncate text-sm font-semibold">{q.title}</span>
                        </div>
                        {isSubmitted && hasScore && (
                          <span className="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-1 rounded">{userScores[q.id]}đ</span>
                        )}
                        {isSubmitted && !hasScore && (
                          <i className="fa-solid fa-circle-check text-amber-500 text-lg"></i>
                        )}
                      </button>
                    );
                  })}
                </div>
              </aside>

              {/* Main Content */}
              <main ref={mainRef} className="flex-1 flex flex-col p-4 md:p-8 lg:p-12 overflow-y-auto bg-slate-100/50 relative scroll-smooth">
                <div className="w-full max-w-4xl mx-auto space-y-6 pb-20">
                  
                  <div className="flex items-center justify-between">
                    <span className="px-5 py-2 bg-emerald-100 text-emerald-800 text-sm font-bold rounded-full uppercase tracking-wider shadow-sm border border-emerald-200">
                      Câu hỏi {currentIndex + 1}
                    </span>
                    <span className="text-slate-500 font-bold bg-white px-4 py-1.5 rounded-lg border border-slate-200 shadow-sm">{currentQ.title}</span>
                  </div>

                  {/* Vùng Câu hỏi */}
                  <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200">
                    <h2 className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed">
                      {currentQ.question}
                    </h2>
                  </div>

                  {/* Vùng Làm bài */}
                  <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200 space-y-5">
                    <div className="flex items-center gap-3 text-slate-700 font-bold text-lg">
                      <i className="fa-solid fa-pen-to-square text-emerald-600 text-xl"></i>
                      <h3>Phần làm bài của sinh viên</h3>
                    </div>
                    <textarea 
                      value={userAnswers[currentQ.id] || ""}
                      onChange={handleTextChange}
                      placeholder="Gõ trực tiếp câu trả lời của bạn vào đây..."
                      className="w-full h-64 p-5 bg-slate-50 border border-slate-300 rounded-2xl focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none resize-y text-lg leading-relaxed text-slate-700 transition-all shadow-inner"
                      disabled={showAnswer[currentQ.id]}
                    />
                    
                    {!showAnswer[currentQ.id] ? (
                      <button 
                        onClick={handleSubmit}
                        disabled={!(userAnswers[currentQ.id] && userAnswers[currentQ.id].trim().length > 10)}
                        className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-3 text-lg"
                      >
                        <i className="fa-solid fa-circle-check text-2xl"></i> Nộp bài & Xem Đáp án
                      </button>
                    ) : (
                      <div className="p-5 bg-amber-50 border border-amber-200 rounded-2xl flex items-start gap-4 text-amber-800 font-medium">
                        <i className="fa-solid fa-circle-info text-2xl mt-0.5"></i>
                        <p className="text-lg">Bài làm đã được nộp. Hãy kéo xuống bên dưới để đối chiếu với đáp án chuẩn, xem barem và tự chấm điểm cho mình.</p>
                      </div>
                    )}
                  </div>

                  {/* Vùng Đáp án & Barem */}
                  {showAnswer[currentQ.id] && (
                    <div className="bg-white rounded-3xl shadow-xl border-2 border-emerald-500 overflow-hidden mt-8 transform transition-all">
                      
                      <div className="p-6 md:p-10 bg-emerald-50 border-b border-emerald-100 space-y-4">
                        <div className="flex items-center gap-3 text-emerald-800 font-extrabold uppercase tracking-widest text-sm">
                          <i className="fa-solid fa-file-lines text-xl"></i> Đáp án chuẩn
                        </div>
                        <p className="text-lg md:text-xl text-emerald-900 leading-relaxed font-medium">
                          {currentQ.standardAnswer}
                        </p>
                      </div>

                      <div className="p-6 md:p-10 space-y-6">
                        <div className="flex items-center gap-3 text-slate-800 font-extrabold uppercase tracking-widest text-sm mb-4">
                          <i className="fa-solid fa-list text-xl"></i> Barem chấm điểm (10 Điểm)
                        </div>
                        
                        <div className="space-y-4">
                          {currentQ.rubric.map((item, idx) => (
                            <div key={idx} className="flex items-center justify-between p-5 bg-slate-50 border border-slate-200 rounded-2xl shadow-sm">
                              <span className="text-slate-700 text-lg pr-4">{item.criterion}</span>
                              <span className="font-black text-emerald-700 shrink-0 bg-emerald-100 px-4 py-2 rounded-xl text-lg border border-emerald-200">
                                {item.points.toFixed(1)} đ
                              </span>
                            </div>
                          ))}
                        </div>

                        {/* Vùng tự chấm điểm */}
                        <div className="mt-10 pt-8 border-t-2 border-slate-100 flex flex-col md:flex-row items-center justify-between gap-6">
                          <div className="flex items-center gap-4 text-slate-700">
                            <i className="fa-solid fa-medal text-4xl text-amber-500 bg-amber-50 p-3 rounded-full"></i>
                            <div>
                              <h4 className="font-extrabold text-xl text-slate-800">Tự đánh giá điểm</h4>
                              <p className="text-slate-500 font-medium">Chấm điểm bài làm của bạn (0 - 10)</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                            <input 
                              type="number" 
                              min="0" max="10" step="0.5"
                              value={userScores[currentQ.id] || ""}
                              onChange={handleScoreChange}
                              className="w-28 h-14 text-center text-2xl font-black bg-white border-2 border-slate-300 rounded-xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none text-emerald-700 transition-all shadow-inner"
                            />
                            <span className="text-2xl font-bold text-slate-400 pr-3">/ 10</span>
                          </div>
                        </div>

                      </div>
                    </div>
                  )}

                  {/* Điều hướng */}
                  <div className="pt-8 flex justify-between px-2">
                    <button
                      onClick={() => setCurrentIndex(currentIndex>0?currentIndex-1:0)}
                      disabled={currentIndex === 0}
                      className={`flex items-center gap-2 px-6 py-4 rounded-2xl font-bold transition-all ${currentIndex === 0 ? 'opacity-50 cursor-not-allowed bg-slate-200 text-slate-500' : 'bg-white text-slate-700 shadow-md hover:shadow-lg border border-slate-200 hover:-translate-y-1'}`}
                    >
                      <i className="fa-solid fa-chevron-left text-xl"></i> <span className="hidden sm:inline">Câu trước</span>
                    </button>
                    <button
                      onClick={() => setCurrentIndex(currentIndex<essayData.length-1?currentIndex+1:currentIndex)}
                      disabled={currentIndex === essayData.length - 1}
                      className={`flex items-center gap-2 px-8 py-4 rounded-2xl font-bold transition-all shadow-lg ${currentIndex === essayData.length - 1 ? 'opacity-50 cursor-not-allowed bg-slate-200 text-slate-500 shadow-none' : 'bg-emerald-600 text-white hover:bg-emerald-500 hover:-translate-y-1'}`}
                    >
                      <span className="hidden sm:inline">Câu tiếp theo</span> <i className="fa-solid fa-chevron-right text-xl"></i>
                    </button>
                  </div>

                </div>
              </main>

              {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/50 z-20 md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)} />}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
